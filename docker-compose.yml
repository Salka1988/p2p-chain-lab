services:
  bootstrap:
    build: .
    init: true
    command:
      - --listen
      - /ip4/0.0.0.0/tcp/4001
      - --node-key-seed
      - bootstrap
      - --validator=8dbb6e3a8c26a5e5411ebda12f317cd4adbbc0fc3bca0d8e0c9ebab9b59e4b49
      - --validator=3e7d04d3813a4c90546bf2dec79da711152dbdc5f927f152485c6555887f2dde
