      - --bootstrap
      - /dns4/node-a/tcp/4001/p2p/12D3KooWE2J1jFvVTa78TFmQuav9dUktUFa9zB1yQaBrHCGGjFQH
      - --bootstrap
      - /dns4/node-c/tcp/4001/p2p/12D3KooWPYLbG43vzPC2oRNrYde8Gz3GBcwrNXBzkX6bYKAacCsA
      - --bootstrap
      - /dns4/node-d/tcp/4001/p2p/12D3KooWLq9gbiTS2zo3qCiCBrBzyL25tocL7biKRjcFgC23KRhy
    depends_on:
      - bootstrap
    environment:
      RUST_LOG: info

  node-c:
    build: .
