      - --validator=a3a4051633a000555919f0fa0686c1cc1a4ad18e24e388f2abcfd8bc3a656d78
      - --chain-path=/data/chain.bin
      - --produce-block-interval-ms
      - "5000"
    ports:
      - "4001:4001"
    environment:
      RUST_LOG: info
    volumes:
      - bootstrap-data:/data

